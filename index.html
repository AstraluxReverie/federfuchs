<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zum träumenden Federfuchs – v0.38</title><style>*{box-sizing:border-box}body{margin:0;background:#100d0b;color:#e8c99a;font:18px Georgia,serif;min-height:100dvh;display:grid;place-items:center}main{text-align:center;width:min(100%,1400px)}figure{margin:0;position:relative;display:inline-block;max-width:100%}img{display:block;max-width:100%;max-height:82dvh;object-fit:contain}button,a{touch-action:manipulation;color:inherit}#door{position:absolute;left:39%;top:55%;width:19%;height:34%;border:0;background:transparent;cursor:pointer}#door:focus-visible{outline:3px solid gold}#enter{display:inline-block;margin:12px;padding:12px 24px;border:1px solid #a57c43;border-radius:6px;text-decoration:none;background:#342419}label{font-size:12px;display:block;opacity:.7}input{max-width:90%}h1{font-size:clamp(22px,4vw,36px);font-weight:normal}</style><main><h1>Zum träumenden Federfuchs</h1><figure id="facade" hidden><img id="house" alt="Fassade des Antiquariats" src="assets/facade.webp"><button id="door" aria-label="Antiquariat betreten"></button></figure><p id="missing">Die Fassadendatei ist noch nicht auf dem Server. Du kannst die freigegebene Vorlage lokal auswählen.</p><a id="enter" href="interior.html?v=038&entry=door">Antiquariat betreten</a><label>Fassadenvorlage auswählen <input type="file" id="pick" accept="image/*"></label></main><script>const img=document.getElementById('house'),figure=document.getElementById('facade'),missing=document.getElementById('missing');img.onload=()=>{figure.hidden=false;missing.hidden=true};img.onerror=()=>{figure.hidden=true;missing.hidden=false};if(img.complete&&img.naturalWidth)img.onload();document.getElementById('pick').onchange=e=>{const f=e.target.files[0];if(f)img.src=URL.createObjectURL(f)};document.getElementById('door').onclick=()=>enterShop();let entering=false;function enterShop(e){if(e)e.preventDefault();if(entering)return;entering=true;const a=document.getElementById('enter');a.textContent='Die Tür öffnet sich …';try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();c.resume();const b=c.createBuffer(1,c.sampleRate*.8,c.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.sin(Math.PI*j/d.length)*.13;const n=c.createBufferSource(),f=c.createBiquadFilter();n.buffer=b;f.type='bandpass';f.frequency.value=420;f.Q.value=3;n.connect(f).connect(c.destination);n.start();}catch(_){}figure.style.transformOrigin='49% 73%';figure.style.transition='transform 1.25s ease-in,opacity .45s  .85s';figure.style.transform='scale(4.8)';figure.style.opacity='0';document.body.style.overflow='hidden';setTimeout(()=>location.href='interior.html?v=038&entry=door',1350);}document.getElementById('door').onclick=enterShop;document.getElementById('enter').addEventListener('click',enterShop);</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>r.scope.startsWith(location.origin+'/federfuchs/')).map(r=>r.unregister()))).catch(()=>{});if('caches' in window)caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('federfuchs-assets-')).map(k=>caches.delete(k)))).catch(()=>{});}</script></html>
