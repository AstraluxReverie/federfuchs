.start();o.stop(ctx.currentTime+dur)}function rustle(){const n=ctx.createBufferSource(),buf=ctx.createBuffer(1,ctx.sampleRate*.6,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length)*.035;n.buffer=buf;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;n.connect(f).connect(master);n.start()}function scene(){rustle();if(Math.random()<.45)sound(520+Math.random()*200,.7,.035,'sine');if(Math.random()<.65){sound(90,.13,.045,'triangle');setTimeout(()=>{if(ctx?.state==='running')sound(75,.12,.035,'triangle')},300)}}b.onclick=async()=>{if(ctx?.state==='running'){clearInterval(timer);await ctx.suspend();b.textContent='Buchhaim hören';return}if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.45;master.connect(ctx.destination)}await ctx.resume();b.textContent='Buchhaim stummschalten';scene();timer=setInterval(scene,3200)};addEventListener('pagehide',()=>{clearInterval(timer);ctx?.close()});})();</script></html>
