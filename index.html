<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zum träumenden Federfuchs – v0.38</title><style>*{box-sizing:border-box}body{margin:0;background:#100d0b;color:#e8c99a;font:18px Georgia,serif;min-height:100dvh;display:grid;place-items:center}main{text-align:center;width:min(100%,1400px)}figure{margin:0;position:relative;display:inline-block;max-width:100%}img{display:block;max-width:100%;max-height:82dvh;object-fit:contain}button,a{touch-action:manipulation;color:inherit}#door{position:absolute;left:39%;top:55%;width:19%;height:34%;border:0;background:transparent;cursor:pointer}#door:focus-visible{outline:3px solid gold}#enter{display:inline-block;margin:12px;padding:12px 24px;border:1px solid #a57c43;border-radius:6px;text-decoration:none;background:#342419}label{font-size:12px;display:block;opacity:.7}input{max-width:90%}h1{font-size:clamp(22px,4vw,36px);font-weight:normal}</style><main><h1>Zum träumenden Federfuchs</h1><figure id="facade" hidden><img id="house" alt="Fassade des Antiquariats" src="assets/facade.webp"><button id="door" aria-label="Antiquariat betreten"></button></figure><p id="missing">Die Fassadendatei ist noch nicht auf dem Server. Du kannst die freigegebene Vorlage lokal auswählen.</p><a id="enter" href="interior.html?v=038">Antiquariat betreten</a><label>Fassadenvorlage auswählen <input type="file" id="pick" accept="image/*"></label></main><script>const img=document.getElementById('house'),figure=document.getElementById('facade'),missing=document.getElementById('missing');img.onload=()=>{figure.hidden=false;missing.hidden=true};img.onerror=()=>{figure.hidden=true;missing.hidden=false};if(img.complete&&img.naturalWidth)img.onload();document.getElementById('pick').onchange=e=>{const f=e.target.files[0];if(f)img.src=URL.createObjectURL(f)};document.getElementById('door').onclick=()=>location.href='interior.html?v=038';document.getElementById('enter').addEventListener('click',e=>{e.currentTarget.textContent='Die Tür öffnet sich …'});</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>r.scope.startsWith(location.origin+'/federfuchs/')).map(r=>r.unregister()))).catch(()=>{});if('caches' in window)caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('federfuchs-assets-')).map(k=>caches.delete(k)))).catch(()=>{});}</script></html>
