<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zum träumenden Federfuchs – v0.38</title><style>*{box-sizing:border-box}body{margin:0;background:#100d0b;color:#e8c99a;font:18px Georgia,serif;min-height:100dvh;display:grid;place-items:center}main{text-align:center;width:min(100%,1400px)}figure{margin:0;position:relative;display:inline-block;max-width:100%}img{display:block;max-width:100%;max-height:82dvh;object-fit:contain}button,a{touch-action:manipulation;color:inherit}#door{position:absolute;left:39%;top:55%;width:19%;height:34%;border:0;background:transparent;cursor:pointer}#door:focus-visible{outline:3px solid gold}#enter{display:inline-block;margin:12px;padding:12px 24px;border:1px solid #a57c43;border-radius:6px;text-decoration:none;background:#342419}label{font-size:12px;display:block;opacity:.7}input{max-width:90%}h1{font-size:clamp(22px,4vw,36px);font-weight:normal}figure[hidden]{display:none}#door{overflow:hidden;perspective:600px}#door::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#170e08,#4a2d18 48%,#170e08);opacity:0;transform-origin:left center;transition:transform .8s ease-in,opacity .2s}body.entering #door::after{opacity:1;transform:rotateY(-85deg)}#veil{position:fixed;inset:0;background:#100d0b;opacity:0;pointer-events:none;transition:opacity .4s;z-index:30;display:grid;place-items:center}body.loading #veil{opacity:1;pointer-events:auto}button,a{white-space:nowrap} @media(prefers-reduced-motion:reduce){figure,#door::after,#veil{transition:none!important}}</style><style>#facade{touch-action:none;cursor:grab;transform-origin:50% 50%;will-change:transform}#facade.dragging{cursor:grabbing}#lookControls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}#lookControls button{background:#342419;border:1px solid #a57c43;border-radius:6px;padding:9px 14px;color:inherit}body.entering #lookControls{visibility:hidden}main{overflow:hidden}#facade[hidden]{display:none}</style><main><h1>Zum träumenden Federfuchs</h1><figure id="facade" hidden><img id="house" alt="Fassade des Antiquariats" src="assets/facade.webp"><button id="door" aria-label="Antiquariat betreten"></button></figure><nav id="lookControls" aria-label="Blickrichtung"><button data-look="-1,0" aria-label="Links schauen">←</button><button data-look="0,-1" aria-label="Nach oben schauen">↑</button><button data-look="0,0">Zentrieren</button><button data-look="0,1" aria-label="Nach unten schauen">↓</button><button data-look="1,0" aria-label="Rechts schauen">→</button></nav><p id="missing">Die Fassadendatei ist noch nicht auf dem Server. Du kannst die freigegebene Vorlage lokal auswählen.</p><a id="enter" href="interior.html?v=038&entry=door">Antiquariat betreten</a><label>Fassadenvorlage auswählen <input type="file" id="pick" accept="image/*"></label></main><div id="veil" role="status">Das Antiquariat wird geöffnet …</div><script>const img=document.getElementById('house'),figure=document.getElementById('facade'),missing=document.getElementById('missing');img.onload=()=>{figure.hidden=false;missing.hidden=true};img.onerror=()=>{figure.hidden=true;missing.hidden=false};if(img.complete&&img.naturalWidth)img.onload();document.getElementById('pick').onchange=e=>{const f=e.target.files[0];if(f){const old=img.src;img.src=URL.createObjectURL(f);if(old.startsWith('blob:'))URL.revokeObjectURL(old)}};document.getElementById('door').onclick=()=>enterShop();let entering=false;function enterShop(e){if(e)e.preventDefault();if(entering)return;entering=true;document.body.classList.add('entering');window.dispatchEvent(new Event('federfuchs-enter'));const preload=document.createElement('link');preload.rel='prefetch';preload.href='interior.html?v=038&entry=door';document.head.append(preload);const a=document.getElementById('enter');a.textContent='Die Tür öffnet sich …';try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();c.resume();const b=c.createBuffer(1,c.sampleRate*.8,c.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.sin(Math.PI*j/d.length)*.13;const n=c.createBufferSource(),f=c.createBiquadFilter();n.buffer=b;f.type='bandpass';f.frequency.value=420;f.Q.value=3;n.connect(f).connect(c.destination);n.start();}catch(_){}figure.style.transformOrigin='49% 73%';figure.style.transition='transform 1.25s ease-in,opacity .45s  .85s';figure.style.transform='scale(4.8)';figure.style.opacity='0';document.body.style.overflow='hidden';setTimeout(()=>document.body.classList.add('loading'),900);setTimeout(()=>location.href='interior.html?v=038&entry=door',1350);}document.getElementById('door').onclick=enterShop;document.getElementById('enter').addEventListener('click',enterShop);</script><script>(()=>{let ctx,timer,master;const b=document.createElement('button');b.textContent='Buchhaim hören';b.style.cssText='position:fixed;right:12px;bottom:12px;background:#342419;color:#e8c99a;border:1px solid #a57c43;padding:10px;border-radius:6px;z-index:20';document.body.append(b);function sound(freq,dur,vol,type){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.75,ctx.currentTime+dur);g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.linearRampToValueAtTime(vol,ctx.currentTime+.04);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g).connect(master);o.start();o.stop(ctx.currentTime+dur)}function rustle(){const n=ctx.createBufferSource(),buf=ctx.createBuffer(1,ctx.sampleRate*.6,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length)*.035;n.buffer=buf;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;n.connect(f).connect(master);n.start()}function scene(){rustle();if(Math.random()<.45)sound(520+Math.random()*200,.7,.035,'sine');if(Math.random()<.65){sound(90,.13,.045,'triangle');setTimeout(()=>{if(ctx?.state==='running')sound(75,.12,.035,'triangle')},300)}}b.onclick=async()=>{if(ctx?.state==='running'){clearInterval(timer);await ctx.suspend();b.textContent='Buchhaim hören';return}if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.45;master.connect(ctx.destination)}await ctx.resume();b.textContent='Buchhaim stummschalten';scene();timer=setInterval(scene,3200)};addEventListener('federfuchs-enter',()=>{clearInterval(timer);if(ctx&&master)master.gain.setTargetAtTime(.001,ctx.currentTime,.25)});addEventListener('pagehide',()=>{clearInterval(timer);ctx?.close()});})();</script><script>(()=>{const f=document.getElementById('facade'),door=document.getElementById('door');let x=0,y=0,p=null,moved=false;const clamp=(v,l)=>Math.max(-l,Math.min(l,v));function draw(){if(document.body.classList.contains('entering'))return;const zoom=1+Math.max(Math.abs(x)/180,Math.abs(y)/130)*.22;f.style.transform='translate('+x+'px,'+y+'px) scale('+zoom+')'}function shift(dx,dy){x=clamp(x+dx,Math.min(180,f.clientWidth*.15));y=clamp(y+dy,Math.min(130,f.clientHeight*.15));draw()}f.addEventListener('pointerdown',e=>{if(document.body.classList.contains('entering'))return;p={id:e.pointerId,x:e.clientX,y:e.clientY};moved=false});f.addEventListener('pointermove',e=>{if(!p||p.id!==e.pointerId)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(!moved&&Math.hypot(dx,dy)<5)return;moved=true;f.setPointerCapture(e.pointerId);f.classList.add('dragging');shift(dx,dy);p.x=e.clientX;p.y=e.clientY});function stop(){p=null;f.classList.remove('dragging')}f.addEventListener('pointerup',stop);f.addEventListener('pointercancel',stop);f.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopImmediatePropagation();moved=false}},true);document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>{const [a,c]=b.dataset.look.split(',').map(Number);if(!a&&!c){x=y=0;draw()}else shift(-a*45,-c*35)});addEventListener('keydown',e=>{if(e.target.matches('input,button,a')||document.body.classList.contains('entering'))return;const d={ArrowLeft:[45,0],ArrowRight:[-45,0],ArrowUp:[0,35],ArrowDown:[0,-35]}[e.key];if(d){e.preventDefault();shift(...d)}});addEventListener('resize',()=>{x=y=0;draw()});})();</script></html>
